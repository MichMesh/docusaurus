name: Checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build and check docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so a PR can be compared with its base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build/ is committed by the publish workflow after each merge; a PR
      # that also changes it would fight that commit.
      - name: Check the PR leaves build/ alone
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- build)
          if [ -n "$changed" ]; then
            echo "::error title=build/ is generated::This PR changes build/. The publish workflow rebuilds and commits it after every merge, so leave it out of PRs: git checkout origin/${{ github.base_ref }} -- build"
            echo "$changed" | head -20
            exit 1
          fi

      - name: Check docs source
        run: npm run check:docs

      # Before the build: it reads build/ from git, and the build overwrites it.
      - name: Check committed build output
        run: node scripts/check-build.mjs committed

      - name: Build
        run: npm run build

      - name: Check redirects
        run: npm run check:build

