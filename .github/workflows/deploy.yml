name: Build and publish site

# Builds the site on every push to master and publishes it to the gh-pages
# branch. The michmesh.com server deploys gh-pages when GitHub's webhook
# reports the push.

on:
  push:
    branches:
      - master

permissions:
  contents: write

# One publish at a time, in order, so an older build never lands on top of
# a newer one.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Lets the next step tell which build michmesh.com is serving.
      - name: Stamp the build with this commit
        run: echo "$GITHUB_SHA" > build/version.txt

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          # Keep gh-pages to a single commit instead of a full copy of the
          # site per merge; the server's fetch + reset --hard handles it.
          force_orphan: true

      - name: Wait for michmesh.com to serve this build
        run: scripts/wait-for-deploy.sh "$GITHUB_SHA"
