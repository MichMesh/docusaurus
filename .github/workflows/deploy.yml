name: Build and publish site

# michmesh.com is served by GitHub Pages. On every push to master this
# builds the site, deploys it to Pages, and checks that michmesh.com is
# serving the new build.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, in order; a newer push waits for the current deploy
# instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Lets the last step tell which build michmesh.com is serving.
      - name: Stamp the build with this commit
        run: echo "$GITHUB_SHA" > build/version.txt

      - name: Check the build is complete
        run: npm run check:build

      - name: Upload the build for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Wait for michmesh.com to serve this build
        run: scripts/wait-for-deploy.sh "$GITHUB_SHA"
